<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/seema/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ice Cream</title>
    
    <!-- PWA & Mobile Web App Meta Tags (iOS & Android) -->
    <link rel="manifest" href="/seema/manifest.json" />
    <meta name="theme-color" content="#1C1220" />
    
    <!-- iOS Specific Web App & Native Shortcut Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ice Cream" />
    <link rel="apple-touch-icon" href="/seema/favicon.svg" />

    <!-- Android Specific Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Ice Cream" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/seema/assets/index-CoRVuJIn.js"></script>
    <link rel="stylesheet" crossorigin href="/seema/assets/index-hZd8NgHU.css">
  </head>
  <body>
    <!-- Theme applied before React mounts to prevent flash of wrong theme -->
    <script>
      (function() {
        var t = localStorage.getItem('icecream_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (document.body) document.body.setAttribute('data-theme', t);
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
